<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV UI</title>

<style>
	* {
		margin: 0;
		padding: 0;
		box-sizing: border-box;
		user-select: none;
	}

	body {
		display: flex;
		justify-content: center;
		align-items: center;
		height: 100vh;
		font-family: Arial, sans-serif;
		background: rgb(0,59,119);
		background: radial-gradient(circle, rgba(0,59,119,1) 0%, rgba(42,75,129,1) 100%);
	}

	.container {
		display: grid;
		grid-template-columns: repeat(5, 200px);
		grid-template-rows: repeat(2, 120px);
		grid-gap: 40px;
		justify-content: center;
	}

	.block {
		width: 200px;
		height: 120px;
		display: flex;
		justify-content: center;
		align-items: center;
		border-radius: 15px;
		color: white;
		font-size: 1.2rem;
		transition: transform 0.2s ease, box-shadow 0.2s ease;
		box-shadow: 0 0 25px rgba(0,0,0,0.2);
		cursor: pointer;
	}

	.block.selected {
		transform: scale(1.2);
		box-shadow: 0 0 25px rgba(4,105,226,0.8);
	}

	.block:hover {
		transform: scale(1.2);
		box-shadow: 0 0 25px rgba(4,105,226,0.8);
	}
</style>

<script src="../protonshell.js"></script>

<script>
var container;
var mainPath = "\\Apps\\";

var gradients = [
	"linear-gradient(180deg, #e74c3c, #c33425)",
	"linear-gradient(180deg, #1ac6fb, #1d72f2)",
	"linear-gradient(180deg, #ffa601, #f9691d)",
	"linear-gradient(180deg, #2ecc71, #159f50)",
	"linear-gradient(180deg, #d46cfb, #862ec3)",
	"linear-gradient(180deg, #7882ff, #434dcf)",
	"linear-gradient(180deg, #95a5a6, #626e6f)"
];

var colorCounter = 0;
var selectedIndex = 0;
var appsCountInLine = 5;

function openApp(block) {
	appOpen(block.getAttribute("appPath"), "");
}

function addApp(fileName) {
	var block = document.createElement("div");
	block.classList.add("block");
	block.textContent = fileName.split(".").slice(0, -1).join(".");
	block.setAttribute("appPath", mainPath + fileName);

	block.style.background = gradients[colorCounter % gradients.length];

	block.addEventListener("click", function() {
		openApp(block);
	});

	block.addEventListener("mouseover", function() {
		selectedIndex = Array.from(container.children).indexOf(block);
		updateSelection();
	});

	container.appendChild(block);
	colorCounter++;
}

function updateSelection() {
	var blocks = document.querySelectorAll(".block");

	blocks.forEach(function(block, index) {
		if (index === selectedIndex) {
			block.classList.add("selected");
		} else {
			block.classList.remove("selected");
		}
	});
}

function handleKeyDown(event) {
	var blocks = document.querySelectorAll(".block");

	if (event.key === "ArrowRight") {
		selectedIndex = (selectedIndex + 1) % blocks.length;
	} else if (event.key === "ArrowLeft") {
		selectedIndex = (selectedIndex - 1 + blocks.length) % blocks.length;
	} else if (event.key === "ArrowDown") {
		if (selectedIndex + appsCountInLine < blocks.length) {
			selectedIndex += appsCountInLine;
		}
	} else if (event.key === "ArrowUp") {
		if (selectedIndex - appsCountInLine >= 0) {
			selectedIndex -= appsCountInLine;
		}
	} else if (event.key === "Enter") {
		appOpen(blocks[selectedIndex].getAttribute("appPath"), "");
	}

	updateSelection();
}

document.addEventListener("DOMContentLoaded", function() {
	container = document.getElementById("container");

	document.body.focus();
	document.addEventListener("keydown", handleKeyDown);

	folderList(mainPath, function(response) {
		if (!response.ok)
			return;

		var items = response.result.items || response.result;

		items.forEach(function(item) {
			var fileName = typeof item === "string" ? item : item.name;

			if (!fileName.endsWith(".js") && !fileName.endsWith(".html")) {
				addApp(fileName);
			}
		});

		updateSelection();
	});
});
</script>

</head>

<body>

<div class="container" id="container"></div>

</body>
</html>
